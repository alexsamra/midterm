name: Tests and Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/backend.slnx

      - name: Test with 90% coverage threshold
        run: >-
          dotnet test backend/tests/tests.csproj -c Release --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutput=backend/tests/TestResults/Coverage/
          /p:CoverletOutputFormat=cobertura
          /p:Include="[model*]*%2c[api*]*"
          /p:Exclude="[tests*]*"
          /p:ExcludeByFile="**/obj/**%2c**/Program.cs"
          /p:Threshold=90
          /p:ThresholdType=line
          /p:ThresholdStat=total

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-report
          path: ${{ github.workspace }}/backend/tests/TestResults/Coverage/coverage.cobertura.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ github.workspace }}/backend/tests/TestResults/Coverage/coverage.cobertura.xml
          fail_ci_if_error: false

          token: ${{ secrets.CODECOV_TOKEN }}
